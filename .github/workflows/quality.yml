name: Quality

on:
  pull_request:
  push:
    branches: [main, upstream]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04

    steps:
      - name: Check Out Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.99
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default 1.99.0

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            desktop-file-utils \
            python3-gi \
            xvfb \
            xauth

      - name: Test Linux Desktop Installation
        run: sh packaging/linux/tests/install.sh

      # Cache compiled dependencies as well as downloaded crates. Release uses the
      # same key, with toolchain, manifests and compiler settings checked by rust-cache.
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ runner.os }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/upstream' }}

      # The auditor is pinned to one version, so it is compiled once and reused. Its own root
      # keeps it clear of the rustup shims that live in ~/.cargo/bin.
      - name: Cache Dependency Auditor
        id: dependency-auditor
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install Dependency Auditor
        if: steps.dependency-auditor.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked --root ~/.cargo-audit

      - name: Put the Dependency Auditor on PATH
        run: echo "$HOME/.cargo-audit/bin" >> "$GITHUB_PATH"

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint Sundial and Parhelion across All Targets
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings

      - name: Test Sundial and Parhelion
        run: |
          set -o pipefail
          mkdir -p target
          rm -f target/cargo-timings/cargo-timing.html
          cargo test --release --workspace --locked --timings --message-format=json | tee target/quality-tests.jsonl

      - name: Verify Linux OpenGL Rendering
        timeout-minutes: 3
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SUNDIAL_PREVIEW_VERIFY_SCOPE: ci
          SUNDIAL_PREVIEW_VERIFY_OUTPUT: ${{ github.workspace }}/target/linux-gpu-artifacts
        run: |
          gpu_test_binary=$(python3 - <<'PY'
          import json
          binaries = set()
          with open('target/quality-tests.jsonl') as log:
              for line in log:
                  if not line.startswith('{'):
                      continue
                  try:
                      message = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  target = message.get('target', {})
                  if (message.get('reason') == 'compiler-artifact'
                          and message.get('profile', {}).get('test')
                          and target.get('name') == 'sundial'
                          and 'lib' in target.get('kind', [])
                          and message.get('executable')):
                      binaries.add(message['executable'])
          assert len(binaries) == 1, 'Expected one Sundial Release test executable'
          print(binaries.pop())
          PY
          )
          env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET xvfb-run -a -s '-screen 0 1280x1024x24' "$gpu_test_binary" --exact model_preview::gpu::verification::generated_materials_render_consistently --ignored --nocapture --test-threads=1
          env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET xvfb-run -a -s '-screen 0 1280x1024x24' "$gpu_test_binary" --exact model_preview::gpu::verification::exports::saved_exports_use_the_gpu_and_cancel_on_close --ignored --nocapture --test-threads=1

      - name: Upload Linux OpenGL Readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-gpu-readback
          path: target/linux-gpu-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Check Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --release --workspace --no-deps --locked --lib

      # Any RustSec vulnerability or yanked crate fails this check.
      - name: Audit Dependencies
        run: cargo audit --deny yanked

      - name: Upload Build Timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-timings-quality-${{ runner.os }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14

  windows:
    runs-on: windows-2022

    steps:
      - name: Check Out Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.99
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --no-self-update
          rustup default 1.99.0

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ runner.os }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/upstream' }}

      - name: Lint Sundial and Parhelion Windows Targets
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings

      - name: Test Sundial and Parhelion on Windows
        run: |
          Remove-Item -LiteralPath target/cargo-timings/cargo-timing.html -ErrorAction SilentlyContinue
          cargo test --release --workspace --locked --timings

      # Releases leave the importer out, but its integration code and synthetic tests are linted
      # and run on every change rather than on one branch name. Tests that need private game
      # data stay ignored here.
      - name: Lint Parhelion with the D2 Model Importer
        run: cargo clippy --release --locked -p parhelion --all-targets --features d2-model-importer -- -D warnings

      - name: Test Parhelion with the D2 Model Importer
        run: cargo test --release --locked -p parhelion --features d2-model-importer

      - name: Check the Suite with the D2 Model Importer
        run: cargo check --release --locked -p sundial-suite --features d2-model-importer

      - name: Upload Build Timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-timings-quality-${{ runner.os }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14
